[package]
name = "hemipix"
version = "1.1.1"
edition = "2024"
description = "HeMiPix – converts photos (HEIC, PNG, WebP …) to JPG, PNG, WebP or TIFF in batches, smaller and cropped if wanted"
authors = ["Richard Hemala"]

[[bin]]
name = "HeMiPix"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.18.0"
raw-window-handle = "0.6.2"
kamadak-exif = "0.6"
webp = { version = "0.3", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# smaller debug builds (the build folder grew to several GB): line numbers only for the app, nothing for the libraries
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
